name: Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
      - "recipe_planner/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
      - "recipe_planner/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    name: Build ShelfServe
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: recipe_planner
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit
