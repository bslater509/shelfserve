{% load static %}
<!doctype html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShelfServe{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'recipes/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">ShelfServe</a>
    <nav class="nav">
      <a href="{% url 'recipe_list' %}">Recipes</a>
      <a href="{% url 'planner' %}">Planner</a>
      <a href="{% url 'supermarket_list' %}">Supermarkets</a>
      <a href="{% url 'settings' %}">Settings</a>
    </nav>
  </header>

  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
