{% extends "recipes/base.html" %}
{% block title %}Settings - ShelfServe{% endblock %}
{% block content %}
<section class="toolbar">
  <div>
    <h1>Settings</h1>
    <p class="muted">Set defaults that shape planning and list generation.</p>
  </div>
</section>

<form method="post" class="panel form-panel">
  {% csrf_token %}
  <label>Week starts on {{ form.week_start }}</label>
  <button class="button primary" type="submit">Save settings</button>
</form>
{% endblock %}
